name: Weekly Najma pulse

on:
  schedule:
    # Mondays 03:30 UTC = 07:30 Dubai — pulse lands before Naj's day starts
    - cron: "30 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch DLD open data (official gateway, read-only)
        run: python scripts/fetch_dld.py

      - name: Build pulse.json (sanity gates fail closed)
        env:
          DAC_KEY: ${{ secrets.DAC_KEY }}   # Digital Abbot Cloud — MEED corpus freshness; fails soft if absent
        run: python scripts/build_pulse.py

      - name: Commit pulse.json
        run: |
          git config user.name "najma-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add public/pulse.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "pulse: weekly refresh $(date -u +%F)"
          git push
