name: Najma daily pulse

on:
  schedule:
    - cron: "30 3 * * *"        # 07:30 Dubai every morning — lands before Naj's day
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: najma-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests geopandas contextily scipy matplotlib pyproj shapely pyogrio

      - name: Fetch fresh DLD data (official gateway, read-only)
        run: python scripts/fetch_dld.py
        env:
          DLD_TX_DAYS: "56"
          DLD_RENT_DAYS: "28"

      - name: Build pulse.json (sanity gates fail closed)
        run: python scripts/build_pulse.py

      - name: Ingest pulse.json into the Worker
        env:
          AZIMUTH_URL: ${{ secrets.AZIMUTH_2_URL }}
          INGEST_TOKEN: ${{ secrets.AZ2_INGEST_TOKEN }}
        run: |
          curl -sS -X POST "$AZIMUTH_URL/ingest_market" \
            -H "X-Azimuth-Ingest: $INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: najma-market-pulse/1.0" \
            --data-binary @public/pulse.json -w '\ningest [%{http_code}]\n'

      - name: Render + push the heat map
        env:
          AZIMUTH_URL: ${{ secrets.AZIMUTH_2_URL }}
          INGEST_TOKEN: ${{ secrets.AZ2_INGEST_TOKEN }}
        run: python scripts/push_heatmap.py

      - name: Commit refreshed pulse.json
        run: |
          git config user.name "najma-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add public/pulse.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "pulse: daily refresh $(date -u +%F)"
          git push
