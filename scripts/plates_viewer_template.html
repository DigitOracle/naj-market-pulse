<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floor plates</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1412;--panel:#121C19;--line:rgba(197,165,106,.32);--gold:#C5A56A;--text:#E8E4D8;--mut:#8FA39B}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--ink);color:var(--text);font-family:"IBM Plex Mono",monospace;font-size:13px}
#app{display:grid;grid-template-columns:300px 118px 1fr;gap:12px;height:100%;padding:12px}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
h1{margin:0;font:600 .62rem/1 "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.hd{padding:13px 14px 10px;border-bottom:1px solid rgba(197,165,106,.18)}
.tabs{display:flex;gap:6px;margin-top:9px}.tab{flex:1;text-align:center;padding:6px 4px;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:.62rem;letter-spacing:.06em;color:var(--mut)}
.tab.on{background:var(--gold);color:#0E1613;font-weight:600;border-color:var(--gold)}
#q{width:100%;margin-top:9px;background:rgba(12,20,19,.6);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 9px;font:inherit;font-size:.68rem;outline:none}
#list,#stack{overflow:auto;flex:1;min-height:0}
.b{padding:8px 14px;border-bottom:1px solid rgba(197,165,106,.1);cursor:pointer}.b:hover{background:rgba(197,165,106,.07)}.b.on{background:rgba(197,165,106,.16)}
.b b{display:block;font-weight:500;font-size:.7rem;line-height:1.3}.b span{font-size:.56rem;color:var(--mut);letter-spacing:.04em}
.f{display:flex;align-items:center;gap:6px;padding:0 9px;height:19px;cursor:pointer;font-size:.58rem;color:var(--mut);border-bottom:1px solid rgba(11,20,18,.9)}
.f i{flex:1;height:13px;border-radius:2px;opacity:.75}.f:hover i{opacity:1}.f.on{color:var(--gold)}.f.on i{opacity:1;outline:2px solid #F4D58D}
.f u{width:22px;text-align:right;text-decoration:none}
#main{display:block;padding:16px 20px;overflow:auto}
.t{color:var(--gold);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase}
h2{margin:3px 0 0;font:600 1.5rem/1.2 Fraunces,Georgia,serif}
.pill{display:inline-block;margin:9px 6px 0 0;padding:3px 10px;border-radius:99px;font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#0E1613;font-weight:600}
.pill.n{background:rgba(232,228,216,.1);color:var(--mut);font-weight:400}
h3{margin:16px 0 9px;font:600 .56rem/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border-top:1px solid rgba(197,165,106,.22);padding-top:12px}
#plate svg{display:block;width:100%;height:auto;max-height:56vh}
.lvl{text-align:center;font-size:.72rem;letter-spacing:.22em;color:var(--gold);margin:8px 0 2px;font-weight:600}
.leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px 18px;margin-top:10px;font-size:.66rem}
.leg div{display:flex;align-items:center;gap:8px}.leg i{width:12px;height:12px;border-radius:2px;flex:none}.leg span{margin-left:auto;color:var(--mut)}
.src{font-size:.58rem;color:rgba(143,163,155,.95);line-height:1.6;margin-top:12px;max-width:900px}.src b{color:var(--gold)}.warn{color:#E8C4A8}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto}#list{max-height:30vh}#stack{max-height:24vh}}
</style></head><body><div id="app">
<div class="glass"><div class="hd"><h1>Floor plates</h1><div class="tabs" id="tabs"></div><input id="q" placeholder="find a building"></div><div id="list"></div></div>
<div class="glass"><div class="hd"><h1>Floors</h1></div><div id="stack"></div></div>
<div class="glass" id="main"></div></div>
<script>
const DATA = /*__DATA__*/null;
const COL = {"1":"#C5A56A","2":"#7FA8C9","3":"#8FC7B9","4":"#D9A441","studio":"#B9A6C9","office":"#8FA39B","retail":"#D98C6A","hotel":"#C58FB0","services":"#37423F","homes":"#D9CFB8","other":"#8A8F96"};
const NAME = {"studio":"Studio","1":"One bedroom","2":"Two bedroom","3":"Three bedroom","4":"Four bedroom +","office":"Office","retail":"Shop","other":"Other"};
const SHORT = {"studio":"S","1":"1","2":"2","3":"3","4":"4","office":"O","retail":"R"};
const USE = {"homes":"Homes","hotel":"Hotel","office":"Offices","retail":"Retail","services":"Services and parking"};
const LIFT = "#5B6662", STAIR = "#9A95D6", PLATE = "#2B3532", INK = "#0E1613";
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let st = {d: 0, b: null, f: null};
const hash = () => { const m = location.hash.match(/^#(\w+)\/(\d+)(?:\/(.+))?/); if (!m) return; const i = DATA.findIndex(d => d.slug === m[1]); if (i < 0 || !DATA[i].buildings[m[2]]) return; st.d = i; st.b = m[2]; st.f = m[3] ? decodeURIComponent(m[3]) : null; };
function tabs(){ $("#tabs").innerHTML = DATA.map((d, i) => `<div class="tab ${i === st.d ? "on" : ""}" data-i="${i}">${esc(d.district)}</div>`).join("");
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => { st.d = +t.dataset.i; st.b = null; st.f = null; draw(); }); }
function list(){ const D = DATA[st.d], q = $("#q").value.trim().toLowerCase();
  const rows = Object.entries(D.buildings).filter(([, b]) => Object.keys(b.floors).length && (!q || b.name.toLowerCase().includes(q))).sort((a, b) => a[1].name.localeCompare(b[1].name));
  if (!st.b || !D.buildings[st.b]) st.b = rows.length ? rows[0][0] : null;
  $("#list").innerHTML = rows.map(([i, b]) => `<div class="b ${i === st.b ? "on" : ""}" data-i="${i}"><b>${esc(b.name)}</b><span>${Object.keys(b.floors).length} floors · ${b.plates.length} plates</span></div>`).join("") || '<div class="b"><span>nothing by that name</span></div>';
  document.querySelectorAll(".b[data-i]").forEach(e => e.onclick = () => { st.b = e.dataset.i; st.f = null; draw(); }); }
function stack(){ const b = DATA[st.d].buildings[st.b]; if (!b) { $("#stack").innerHTML = ""; return; }
  const ls = Object.keys(b.floors); if (st.f == null || !(st.f in b.floors)) { const homes = ls.filter(l => b.plates[b.floors[l]].cells.length); st.f = (homes.length ? homes[Math.floor(homes.length / 2)] : ls[0]); }
  $("#stack").innerHTML = ls.slice().reverse().map(l => { const p = b.plates[b.floors[l]], main = p.counts.length ? p.counts.slice().sort((a, c) => c[1] - a[1])[0][0] : p.use;
    return `<div class="f ${l === st.f ? "on" : ""}" data-l="${esc(l)}"><u>${esc(l)}</u><i style="background:${COL[main] || COL[p.use] || COL.other}"></i></div>`; }).join("");
  document.querySelectorAll(".f").forEach(e => e.onclick = () => { st.f = e.dataset.l; draw(true); });
  const on = $(".f.on"); if (on) on.scrollIntoView({block: "nearest"}); }
function svg(b, p, labels){ const o = b.outline, xs = [], ys = []; for (let i = 0; i < o.length; i += 2) { xs.push(o[i]); ys.push(o[i + 1]); }
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), pad = Math.max(3, (x1 - x0) * .03), W = 1000, k = W / (x1 - x0 + 2 * pad), H = (y1 - y0 + 2 * pad) * k;
  const T = a => { let s = ""; for (let i = 0; i < a.length; i += 2) s += ((a[i] - x0 + pad) * k).toFixed(1) + "," + ((y1 - a[i + 1] + pad) * k).toFixed(1) + " "; return s; };
  let h = `<svg viewBox="0 0 ${W} ${H.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">`;
  if (p.tower) h += `<polygon points="${T(o)}" fill="${PLATE}" fill-opacity=".3" stroke="#C5A56A" stroke-opacity=".45" stroke-width="1.4" stroke-dasharray="7 6"/><polygon points="${T(p.tower)}" fill="${PLATE}" stroke="#C5A56A" stroke-opacity=".6" stroke-width="1.8"/>`;
  else h += `<polygon points="${T(o)}" fill="${p.cells.length ? PLATE : (COL[p.use] || PLATE)}" fill-opacity="${p.cells.length ? 1 : .35}" stroke="#C5A56A" stroke-opacity=".6" stroke-width="1.8"/>`;
  for (const [c, a, idx] of p.cells) { const lab = labels && labels[idx] ? labels[idx] : (SHORT[c] || ""); h += `<polygon points="${T(a)}" fill="${COL[c] || COL.other}" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/>`;
    let cx = 0, cy = 0, mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9; for (let i = 0; i < a.length; i += 2) { cx += a[i]; cy += a[i + 1]; mnx = Math.min(mnx, a[i]); mxx = Math.max(mxx, a[i]); mny = Math.min(mny, a[i + 1]); mxy = Math.max(mxy, a[i + 1]); }
    cx /= a.length / 2; cy /= a.length / 2; if (Math.max(mxx - mnx, mxy - mny) * k > 16 && Math.min(mxx - mnx, mxy - mny) * k > 9) h += `<text x="${((cx - x0 + pad) * k).toFixed(1)}" y="${((y1 - cy + pad) * k + 4).toFixed(1)}" font-size="${(labels ? Math.min(12, Math.max(7.5, k * 1.5)) : Math.min(15, Math.max(9, k * 2.2))).toFixed(1)}" font-weight="600" text-anchor="middle" fill="${INK}" fill-opacity=".8">${esc(lab)}</text>`; }
  for (const [kind, a] of p.blocks) h += `<polygon points="${T(a)}" fill="${kind === "lift" ? LIFT : STAIR}" stroke="${INK}" stroke-width="1.3"/>`;
  if (!p.cells.length) h += `<text x="${W / 2}" y="${H / 2 + 5}" font-size="17" letter-spacing="3" text-anchor="middle" fill="#E8E4D8" fill-opacity=".8">${esc((USE[p.use] || p.use).toUpperCase())}</text>`;
  h += `<g transform="translate(${W - 40},38) rotate(${(-b.north).toFixed(1)})"><circle r="17" fill="${INK}" fill-opacity=".6" stroke="#C5A56A" stroke-opacity=".6"/><path d="M0,-12 L5,7 L0,3 L-5,7 Z" fill="#C5A56A"/><text y="-21" font-size="11" fill="#C5A56A" text-anchor="middle">N</text></g></svg>`;
  return h; }
function main(){ const D = DATA[st.d], b = D.buildings[st.b]; if (!b) { $("#main").innerHTML = ""; return; }
  const p = b.plates[b.floors[st.f]], homes = p.counts.reduce((s, c) => s + c[1], 0), same = Object.keys(b.floors).filter(l => b.floors[l] === b.floors[st.f]);
  const leg = p.counts.map(c => `<div><i style="background:${COL[c[0]] || COL.other}"></i>${NAME[c[0]] || c[0]}<span>${c[1]}${c[2] && p.use !== "office" && p.use !== "retail" ? " · " + Math.round(c[2] * 10.7639).toLocaleString("en") + " sq ft" : ""}</span></div>`).join("")
    + (p.blocks.length ? `<div><i style="background:${LIFT}"></i>Lifts<span>${b.lifts || ""}</span></div><div><i style="background:${STAIR}"></i>Stairs</div>` : "");
  const basis = p.basis === "units" ? "The unit numbers, types and sizes are the Land Department units register's, one row per unit; they are laid round the facade in unit-number order." : p.basis === "municipality" ? "How many homes this floor carries is the Municipality's count for the floor, shared between the types the Land Department register puts on it." : p.basis === "register" ? "How many homes of each type this floor carries is the Land Department register's units for the type, spread evenly over the floors the register gives it." : "";
  const warn = (b.conflict ? "The map and the register disagree about which building stands on this footprint. " : "") + (b.fits === false ? "The model stands much shorter than the register building: this footprint may be its podium. " : "")
    + (p.dm_use ? "The Municipality records this floor as " + (USE[p.dm_use] || p.dm_use).toLowerCase() + "; the Land Department register lists these homes on it, so they are drawn. " : "")
    + (p.tower ? "The footprint (dashed) is far larger than the floor the register describes, so it is read as a podium: the floor is drawn inside it at the size the register implies. " : "")
    + (p.skip === "small" ? "Not drawn: the register puts more homes on this floor than this footprint can hold - several buildings are probably bound to one record. " : p.skip === "many" ? "Not drawn: too many units on one floor to draw. " : "");
  $("#main").innerHTML = `<div class="t">${esc(D.district)} · ${esc(b.name)}</div><h2>Floor ${esc(st.f)}</h2><span class="pill">${esc(USE[p.use] || p.use)}</span>${homes ? `<span class="pill n">${homes} ${p.use === "office" ? "offices" : p.use === "retail" ? "shops" : "homes"} on the floor</span>` : ""}<span class="pill n">${same.length > 1 ? "same plate on " + same.length + " floors" : "only this floor"}</span>
    <h3>The floor plate</h3><div id="plate">${svg(b, p, (b.labels || {})[st.f])}</div><div class="lvl">LEVEL ${esc(st.f)}</div><div class="leg">${leg}</div>
    <div class="src"><b>Indicative layout.</b> The outline is this building's surveyed footprint${p.cells.length ? "; the sizes of the homes against each other are the register's. " + basis + " Where each home sits, and where the lifts and stairs are, is not published for this building - that comes from a Revit model or the developer's stacking plan, as on The Symphony. " + (p.basis === "units" ? "" : " No unit numbers are shown: the units register does not cover this building well enough.") : "."}${warn ? ` <span class="warn">${warn}</span>` : ""}</div>`; }
function draw(keep){ tabs(); if (!keep) list(); else document.querySelectorAll(".b[data-i]").forEach(e => e.classList.toggle("on", e.dataset.i === st.b)); stack(); main();
  history.replaceState(null, "", "#" + DATA[st.d].slug + "/" + st.b + "/" + encodeURIComponent(st.f)); }
$("#q").oninput = () => { st.b = null; st.f = null; draw(); };
hash(); draw();
</script></body></html>
